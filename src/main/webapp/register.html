<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — ZyroTech</title>
<link rel="icon" href="assets/img/logo.jpeg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notiflix@3.2.6/dist/notiflix-3.2.6.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          indigo: { DEFAULT: '#121F47', 50: '#EEF1F8' },
          cyan: { DEFAULT: '#00BFB3', light: '#17D6C9', soft: '#E3FBF9' }
        },
        fontFamily: {
          display: ['Space Grotesk', 'sans-serif'],
          sans: ['Inter', 'sans-serif']
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen">

<div class="min-h-screen grid lg:grid-cols-2">

  <div class="hero-bolt-bg relative hidden lg:flex flex-col justify-between p-12 text-white overflow-hidden">
    <a href="index.html" class="flex items-center gap-2 relative z-10">
      <img src="assets/img/logo.jpeg" alt="ZyroTech" class="h-10 w-10 rounded-lg object-cover">
      <span class="font-display font-bold text-xl">Zyro<span style="color:var(--cyan);">Tech</span></span>
    </a>
    <div class="relative z-10 max-w-sm">
      <h2 class="font-display font-bold text-3xl leading-tight">Join the ZyroTech circuit.</h2>
      <p class="mt-4 text-sm" style="color:#B7C2DE;">Create an account for faster checkout, order tracking and member-only deals.</p>
    </div>
    <p class="relative z-10 text-xs" style="color:#7A87AC;">&copy; 2026 ZyroTech</p>
    <div class="absolute -bottom-16 -right-16 w-72 h-72 rounded-full" style="background: radial-gradient(circle, rgba(0,191,179,0.25), transparent 70%);"></div>
  </div>

  <div class="flex items-center justify-center p-6 sm:p-12">
    <div class="w-full max-w-md">
      <a href="index.html" class="flex lg:hidden items-center gap-2 mb-8 justify-center">
        <img src="assets/img/logo.jpeg" alt="ZyroTech" class="h-9 w-9 rounded-lg object-cover">
        <span class="font-display font-bold text-lg" style="color:var(--indigo);">Zyro<span style="color:var(--cyan);">Tech</span></span>
      </a>

      <h1 class="font-display font-bold text-2xl" style="color:var(--indigo);">Create your account</h1>
      <p class="text-sm text-gray-400 mt-1">A few details and you're in.</p>

      <form class="mt-7 space-y-4" onsubmit="event.preventDefault(); register();">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="zt-label">First Name</label>
            <input type="text" id="fname" class="zt-input" placeholder="John">
          </div>
          <div>
            <label class="zt-label">Last Name</label>
            <input type="text" id="lname" class="zt-input" placeholder="Doe">
          </div>
        </div>
        <div>
          <label class="zt-label">Email Address</label>
          <input type="email" id="regEmail" class="zt-input" placeholder="you@example.com">
        </div>
        <div>
          <label class="zt-label">Password</label>
          <input type="password" id="regPassword" class="zt-input" placeholder="At least 8 characters">
        </div>
        <div>
          <label class="zt-label">Address Line 1</label>
          <input type="text" id="lineOne" class="zt-input" placeholder="Street address">
        </div>
        <div>
          <label class="zt-label">Address Line 2</label>
          <input type="text" id="lineTwo" class="zt-input" placeholder="Apartment, suite, etc. (optional)">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="zt-label">City</label>
            <select id="city" class="zt-input">
              <option value="0">Select a City</option>
            </select>
          </div>
          <div>
            <label class="zt-label">Postal Code</label>
            <input type="text" id="postalCode" class="zt-input" placeholder="10230">
          </div>
        </div>
        <div>
          <label class="zt-label">Mobile Number</label>
          <input type="tel" id="mobile" class="zt-input" placeholder="07X XXX XXXX">
        </div>
        <button type="submit" class="btn-primary w-full"><i class="fas fa-bolt"></i> Create Account</button>
      </form>

      <p class="text-sm text-gray-400 text-center mt-7">
        Already have an account? <a href="login.html" class="text-red-primary font-semibold">Sign in</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/notiflix@3.2.6/dist/notiflix-3.2.6.min.js"></script>
<script src="assets/js/register.js"></script>
</body>
</html>
