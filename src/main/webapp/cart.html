<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — ZyroTech</title>
<link rel="icon" href="assets/img/logo.jpeg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notiflix@3.2.6/dist/notiflix-3.2.6.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          indigo: { DEFAULT: '#121F47', 50: '#EEF1F8' },
          cyan: { DEFAULT: '#00BFB3', light: '#17D6C9', soft: '#E3FBF9' }
        },
        fontFamily: {
          display: ['Space Grotesk', 'sans-serif'],
          sans: ['Inter', 'sans-serif']
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header-content></header-content>

<div class="max-w-7xl mx-auto px-4 md:px-8 py-10">

  <div class="flex items-center justify-between mb-8">
    <h1 class="font-display font-bold text-2xl md:text-3xl" style="color:var(--indigo);">Shopping Cart</h1>
    <span class="text-sm font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full">0 items</span>
  </div>

  <div class="grid lg:grid-cols-3 gap-8">

    <div class="lg:col-span-2 space-y-4" id="cart-item"></div>

    <div class="bg-white rounded-2xl card-shadow border p-6 h-fit sticky top-6" style="border-color:var(--line);">
      <h2 class="font-display font-semibold text-lg mb-5" style="color:var(--indigo);">Order Summary</h2>
      <div class="flex items-center justify-between text-sm mb-3" id="qtyText">Subtotal (0 items)</div>
      <div class="flex items-center justify-between text-sm text-gray-500 mb-3">
        <span>Items total</span>
        <span>Rs.<span id="order-subtotal">0.00</span></span>
      </div>
      <div class="flex items-center justify-between text-sm text-gray-500 mb-4 pb-4 border-b" style="border-color:var(--line);">
        <span>Shipping</span>
        <span>Rs.500.00</span>
      </div>
      <div class="flex items-center justify-between font-display font-bold text-lg mb-6" style="color:var(--indigo);">
        <span>Total</span>
        <span>Rs.<span id="order-total">0.00</span></span>
      </div>
      <a href="checkout.html" class="btn-primary w-full"><i class="fas fa-lock"></i> Proceed to Checkout</a>
      <a href="index.html" class="btn-outline w-full mt-3">Continue Shopping</a>
    </div>
  </div>
</div>

<footer-content></footer-content>

<script src="https://cdn.jsdelivr.net/npm/notiflix@3.2.6/dist/notiflix-3.2.6.min.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/footer.js"></script>
<script src="assets/js/cart.js"></script>
<script>
  window.addEventListener("load", loadCartItems);
</script>
</body>
</html>
