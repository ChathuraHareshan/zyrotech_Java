<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Account — ZyroTech</title>
<link rel="icon" href="assets/img/logo.jpeg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notiflix@3.2.6/dist/notiflix-3.2.6.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          indigo: { DEFAULT: '#121F47', 50: '#EEF1F8' },
          cyan: { DEFAULT: '#00BFB3', light: '#17D6C9', soft: '#E3FBF9' }
        },
        fontFamily: {
          display: ['Space Grotesk', 'sans-serif'],
          sans: ['Inter', 'sans-serif']
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen hero-bolt-bg flex items-center justify-center p-6">

<div class="w-full max-w-md bg-white rounded-3xl card-shadow p-8 sm:p-10 relative z-10">
  <a href="index.html" class="flex items-center gap-2 justify-center mb-8">
    <img src="assets/img/logo.jpeg" alt="ZyroTech" class="h-10 w-10 rounded-lg object-cover">
    <span class="font-display font-bold text-lg" style="color:var(--indigo);">Zyro<span style="color:var(--cyan);">Tech</span></span>
  </a>

  <div class="text-center mb-7">
    <div class="action-icon !w-14 !h-14 !bg-cyan-soft text-red-primary text-2xl mx-auto mb-4">
      <i class="fas fa-envelope-circle-check"></i>
    </div>
    <h1 class="font-display font-bold text-2xl" style="color:var(--indigo);">Verify your account</h1>
    <p class="text-sm text-gray-400 mt-2">We sent a verification code to your email. Enter it below to activate your account.</p>
  </div>

  <form class="space-y-5" onsubmit="event.preventDefault(); verifyAccount();">
    <div>
      <label class="zt-label">Verification Code</label>
      <input type="text" id="verificationCode" class="zt-input text-center tracking-[0.3em] font-display font-semibold text-lg" placeholder="000000">
    </div>
    <button type="submit" class="btn-primary w-full"><i class="fas fa-check"></i> Verify Account</button>
  </form>

  <p class="text-sm text-gray-400 text-center mt-7">
    Didn't get a code? <a href="register.html" class="text-red-primary font-semibold">Try registering again</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/notiflix@3.2.6/dist/notiflix-3.2.6.min.js"></script>
<script src="assets/js/verify-account.js"></script>
</body>
</html>
